const SIGNED = {};
async function sign(paths) {

  if (need.length) {
    const t = await token();
    const r = await fetch(SB + "/storage/v1/object/sign/" + BUCKET, { method: "POST", headers: { apikey: KEY, authorization: "Bearer " + t, "content-type": "application/json" }, body: JSON.stringify({ expiresIn: 3600, paths: need }) });
    const d = await r.json().catch(() => []);
    if (Array.isArray(d)) for (const x of d) if (x.signedURL) SIGNED[x.path] = { url: SB + "/storage/v1" + x.signedURL, exp: Date.now() + 3300e3 };

}

function shrink(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);

    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Couldn't read that photo")); };

function md(src) {
  const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out = "", list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of String(src || "").split("\n")) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); const n = m[1].length + 1; out += `<h${n}>${inl(m[2])}</h${n}>`; continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inl(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inl(m[1])}</li>`; continue; }
    close(); out += `<p>${inl(l)}</p>`;
  }
  close(); return out;
}

    await loadTyping(); lastTy = Date.now();
    const isOpen = CHAT && typing(CHAT.id);
    if (CHAT && (wasOpen || isOpen || !RT.ok)) { try { await pollChat(); } catch {} }
    patchTyping();
  } finally { tyBusy = false; }
}
setInterval(() => {
  if (!S) return;
  patchTyping();                                   // dots vanish on time even with no event
  if (document.visibilityState !== "visible") return;
  if (!RT.ok) { rtConnect(); if (CHAT || Date.now() - lastTy > 6000) pollTyping(); }   // fallback: ≤3 s poll while a chat is open
}, 1000 * 3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { rtConnect(); pollTyping(); refreshLists(false); } });
window.addEventListener("online", () => rtConnect());

function sheet(html) { const d = document.createElement("div"); d.className = "sheet"; d.innerHTML = `<div class="box">${html}</div>`; d.onclick = e => { if (e.target === d) d.remove(); }; document.body.appendChild(d); return d; }

async function newTask(pid) {
  if (!P.length) await load();
  const cur = pid || (location.hash.match(/^#\/p\/([\w-]+)/) || [])[1] || (WIDE() && MID !== "w" ? MID : "");
  let pr = "normal";
  const d = sheet(`<h3>New task</h3><div class="muted small">Tab picks it up from here.</div>
    <label for="ntp">Project</label><select id="ntp">${cur ? "" : '<option value="">Choose a project…</option>'}${P.map(p => `<option value="${p.id}" ${p.id === cur ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
    <label for="ntt">Title</label><input type="text" id="ntt" placeholder="What needs doing?" maxlength="200">
    <label for="ntd">Details</label><textarea id="ntd" placeholder="Anything Tab should know (optional)"></textarea>
    <label>Priority</label><div class="seg"><button class="on" data-p="normal">Normal</button><button data-p="urgent">Urgent</button></div>
    <div class="err" id="nte"></div>
    <div class="acts"><button class="btn plain" id="ntc">Cancel</button><button class="btn" id="nts">Save task</button></div>`);
  d.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { pr = b.dataset.p; d.querySelectorAll("[data-p]").forEach(x => x.className = x === b ? "on" + (pr === "urgent" ? " u" : "") : ""); });
  $("ntc").onclick = () => d.remove();
  setTimeout(() => $("ntt").focus(), 50);
  $("nts").onclick = async () => {
    const project_id = $("ntp").value, title = $("ntt").value.trim();
    if (!project_id) { $("nte").textContent = "Pick a project."; return; }
    if (!title) { $("nte").textContent = "Give it a title."; return; }
    $("nts").disabled = true;
    try {
      const r = await db("tasks", { method: "POST", body: { project_id, title, details: $("ntd").value.trim(), priority: pr, status: "new", created_by: "mendel" } });
      d.remove(); toast("Task saved"); await load(); if (WIDE()) { MID = project_id; FILTER = "open"; } location.hash = "#/t/" + r[0].id;
    } catch (x) { $("nte").textContent = x.message; $("nts").disabled = false; }
  };
}

function newProject() {
  let color = COLORS[P.length % COLORS.length];
  const d = sheet(`<h3>New project</h3>
    <label for="npn">Name</label><input type="text" id="npn" maxlength="80" placeholder="Project name">
    <label>Color</label><div class="sw">${COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c === color ? "on" : ""}" aria-label="color"></button>`).join("")}</div>
    <div class="err" id="npe"></div>
    <div class="acts"><button class="btn plain" id="npc">Cancel</button><button class="btn" id="nps">Create project</button></div>`);
  d.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { color = b.dataset.c; d.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b)); });
  $("npc").onclick = () => d.remove();
  $("nps").onclick = async () => {
    const name = $("npn").value.trim(); if (!name) { $("npe").textContent = "Give it a name."; return; }
    $("nps").disabled = true;
    try { const sort = Math.max(0, ...P.map(p => p.sort)) + 1; const r = await db("projects", { method: "POST", body: { name, color, sort } }); d.remove(); toast("Project created"); await load(); location.hash = "#/p/" + r[0].id; }
    catch (x) { $("npe").textContent = x.message; $("nps").disabled = false; }
  };
}

function login() {
  top("Command Center"); app.className = "";
  app.innerHTML = `<div class="login card"><h3 style="margin:0 0 4px;font-size:20px">Sign in</h3><div class="muted small">Private. Only you.</div>
    <form id="lf"><label for="le">Email</label><input type="email" id="le" autocomplete="username" autocapitalize="off" required>
    <label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" required>
    <div class="err" id="lerr"></div><div class="acts"><button class="btn" id="lb">Sign in</button></div></form></div>`;
  $("lf").onsubmit = async e => {
    e.preventDefault(); $("lb").disabled = true; $("lerr").textContent = "";
    try { await auth("password", { email: $("le").value.trim(), password: $("lp").value }); route(); rtConnect(); }
    catch (x) { $("lerr").textContent = /invalid/i.test(x.message) ? "Wrong email or password." : x.message; $("lb").disabled = false; }
  };
}

let lastWide = null;
async function route() {
  document.querySelectorAll(".sheet,.lb").forEach(x => x.remove());
  if (!S) return login();
  const h = location.hash; let m;
  try {
    if (!P.length || !WIDE()) await load();
    if (WIDE()) { lastWide = true; await wide(h); return; }
    lastWide = false; CHAT = null; document.body.classList.remove("wd");
    if ((m = h.match(/^#\/p\/([\w-]+)/))) project(m[1]);
    else if ((m = h.match(/^#\/t\/([\w-]+)/))) await task(m[1]);
    else { FILTER = "open"; PTAB = "tasks"; home(); }
    window.scrollTo(0, 0);
  } catch (x) { if (x.message !== "login") { app.className = ""; app.innerHTML = `<div class="empty">Couldn't load: ${esc(x.message)} <br><br><button class="btn" onclick="location.reload()">Try again</button></div>`; } }
}
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { if (S && lastWide !== null && WIDE() !== lastWide && !(document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) { CHAT = null; app.innerHTML = ""; route(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });
route(); rtConnect();
})();
</script>
</body></html>
